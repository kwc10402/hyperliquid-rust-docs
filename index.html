<body>
<div id="universe" aria-label="Interactive three-dimensional protocol map"></div>
<div class="vignette" aria-hidden="true"></div>
<header class="identity"><img src="./mark.svg" width="34" height="34" alt=""><div><strong>HLX <i>Atlas</i></strong><span>THE EXCHANGE MACHINE</span></div></header>
<div class="top-meta"><span class="live-dot"></span>MAINNET 113<span class="divider">/</span><span id="snapshot-date">RESEARCH SNAPSHOT</span><button id="about-toggle" aria-label="About this map">i</button></div>
<nav class="layer-rail" aria-label="Map layers"><button data-layer="architecture" class="active"><span>01</span>System</button><button data-layer="flow"><span>02</span>Execution</button><button data-layer="state"><span>03</span>Commitments</button><button data-layer="crates"><span>04</span>Rust workspace</button><button data-layer="actions"><span>05</span>Action surface</button></nav>

<button id="back-map" class="back-map" hidden>↑ Whole machine</button>
<div class="search-shell"><label class="sr-only" for="map-search">Find a component</label><span>⌕</span><input id="map-search" placeholder="Find a component…" autocomplete="off"><kbd>/</kbd><div id="search-results" hidden></div></div>
<div class="scope-filters" id="scope-filters" hidden></div>
<aside class="inspector" id="inspector" hidden aria-live="polite"></aside>
<div class="hover-label" id="hover-label" hidden></div>
<div class="journey" id="journey" hidden><button id="flow-play" aria-label="Play execution journey">▶</button><label class="sr-only" for="flow-step">Execution stage</label><input id="flow-step" type="range" min="0" max="7" value="0"><output id="flow-output">01 / 08</output><button id="flow-close" aria-label="Pause execution journey">Ⅱ</button></div>
<div class="view-controls"><button id="map-reset" aria-label="Reset camera">⌖</button><button id="map-zoom-in" aria-label="Zoom in">+</button><button id="map-zoom-out" aria-label="Zoom out">−</button><button id="motion-toggle" aria-label="Pause animation">Ⅱ</button><button id="tour-toggle" aria-label="Take a guided tour">↗<span>Tour</span></button></div>
